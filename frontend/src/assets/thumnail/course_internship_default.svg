    <path d="M-13 -2 L-13 8 C-13 13 13 13 13 8 L13 -2" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <path d="M15 -3 L15 12" fill="none" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="15" cy="14" r="2" fill="#e2e8f0" />
  </g>

  <!-- Placeholder Text -->
  <text x="400" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="3">
